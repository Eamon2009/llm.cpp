name: ci

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cpp:
              - '**/*.cpp'
              - '**/*.h'
              - '**/*.hpp'
              - '**/*.mm'
              - '**/CMakeLists.txt'
            python:
              - '**/*.py'
              - '**/requirements.txt'
              - '**/pyproject.toml'
  cpp-quality:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cpp == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install C++ Quality Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cppcheck

      - name: Clang-Format Check
        run: |
          echo "### Clang-Format Check" >> $GITHUB_STEP_SUMMARY
          FILES=$(find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.mm" \) | grep -v build)
          if [ -n "$FILES" ]; then
            clang-format --dry-run --Werror $FILES
            echo "Code formatting is correct." >> $GITHUB_STEP_SUMMARY
          fi

      - name: CppCheck Static Analysis
        run: |
          echo "### CppCheck Static Analysis" >> $GITHUB_STEP_SUMMARY
          cppcheck \
            --enable=all \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --std=c++17 \
            .
          echo "Cppcheck passed with 0 issues." >> $GITHUB_STEP_SUMMARY

  cpp-build-matrix:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cpp == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux Compilers
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang

          # macOS (Clang + Objective-C++ Metal support)
          - os: macos-latest
            compiler: clang

          # Windows Compilers
          - os: windows-latest
            compiler: msvc
          - os: windows-latest
            compiler: gcc
          - os: windows-latest
            compiler: clang

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # --- Dependencies Setup ---
      - name: Install OpenMP / Build Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ clang libomp-dev

      - name: Install Dependencies (Windows MinGW / Clang)
        if: runner.os == 'Windows' && matrix.compiler != 'msvc'
        run: |
          choco install mingw llvm -y

      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows' && matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      # --- Cross-Compiler Builds ---
      - name: Build Executable (GCC)
        if: matrix.compiler == 'gcc'
        run: |
          echo "### Building with GCC on ${{ runner.os }}" >> $GITHUB_STEP_SUMMARY
          g++ -std=c++17 -O3 -march=native -fopenmp -I. -Iinclude -o llm.exe main.cpp

      - name: Build Executable (Clang / Objective-C++)
        if: matrix.compiler == 'clang'
        run: |
          echo "### Building with Clang on ${{ runner.os }}" >> $GITHUB_STEP_SUMMARY
          if [ "$RUNNER_OS" == "macOS" ]; then
            # Objective-C++ & Metal Framework linkage if .mm file is present
            if [ -f "llm.mm" ]; then
              clang++ -std=c++17 -O3 -I. -Iinclude main.cpp llm.mm -framework Foundation -framework Metal -framework MetalPerformanceShaders -o llm
            else
              clang++ -std=c++17 -O3 -I. -Iinclude main.cpp -o llm
            fi
          else
            clang++ -std=c++17 -O3 -march=native -fopenmp -I. -Iinclude -o llm.exe main.cpp
          fi

      - name: Build Executable (MSVC)
        if: matrix.compiler == 'msvc'
        run: |
          echo "### Building with MSVC on Windows" >> $GITHUB_STEP_SUMMARY
          cl /std:c++17 /O2 /openmp /I. /Iinclude main.cpp /Fe:llm.exe

  python-quality:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 pylint bandit

      - name: Black Formatting Check
        run: black --check --diff .

      - name: isort Imports Check
        run: isort --check-only --diff .

      - name: Flake8 Linting
        run: flake8 . --max-line-length=127 --count --statistics

      - name: Pylint Analysis
        run: |
          FILES=$(find . -name "*.py" -type f | grep -v __pycache__)
          if [ -n "$FILES" ]; then
            pylint $FILES --fail-under=7.0 --disable=C0111,C0103,R0913,W0212
          fi

      - name: Bandit Security Scan
        run: bandit -r . -ll
  python-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Run Pytest
        run: |
          pytest --cov=. --cov-report=term-missing -v

  summary:
    runs-on: ubuntu-latest
    needs: [detect-changes, cpp-quality, cpp-build-matrix, python-quality, python-tests]
    if: always()

    steps:
      - name: Generate Summary Report
        run: |
          echo "## CI Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **C++ Changed**: `${{ needs.detect-changes.outputs.cpp }}`" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Changed**: `${{ needs.detect-changes.outputs.python }}`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **C++ Quality Check**: ${{ needs.cpp-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **C++ Multi-Compiler Builds**: ${{ needs.cpp-build-matrix.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Quality Check**: ${{ needs.python-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Pytest Suite**: ${{ needs.python-tests.result }}" >> $GITHUB_STEP_SUMMARY
