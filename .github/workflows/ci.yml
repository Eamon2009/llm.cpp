name: ci
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      cpp_files: ${{ steps.filter.outputs.cpp_files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: json
          filters: |
            cpp:
              - '**/*.cpp'
              - '**/*.h'
              - '**/*.hpp'
              - '**/*.mm'
              - '**/CMakeLists.txt'

  cpp-build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cpp == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Ubuntu
            variant: gcc
            cxx: g++
          - os: ubuntu-latest
            os_name: Ubuntu
            variant: clang
            cxx: clang++
          - os: macos-latest
            os_name: macOS
            variant: cpu
            cxx: clang++
          - os: windows-latest
            os_name: Windows
            variant: cpu-x64
    steps:
      - uses: actions/checkout@v7

      - name: Report compiler version
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            echo "Using MSVC (cl.exe)"
          else
            echo "CXX=${{ matrix.cxx }}"
            ${{ matrix.cxx }} --version || true
          fi

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ clang libomp-dev

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (Ubuntu GCC)
        if: matrix.variant == 'gcc'
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -march=native -fopenmp -I. -Iinclude -o llm main.cpp
          file llm

      - name: Build (Ubuntu Clang)
        if: matrix.variant == 'clang'
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O3 -march=native -fopenmp -I. -Iinclude -o llm main.cpp
          file llm

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "llm.mm" ]; then
            clang++ -std=c++17 -O3 -arch arm64 -DENABLE_METAL -I. -Iinclude llm.mm -framework Foundation -framework Metal -framework MetalPerformanceShaders -o llm
          else
            clang++ -std=c++17 -O3 -arch arm64 -I. -Iinclude -o llm main.cpp
          fi
          file llm

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++17 /O2 /DNDEBUG /EHsc /Iinclude /I. main.cpp /Fe:llm.exe
          dir llm.exe

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          ./llm --chat >/dev/null 2>&1
          exit 0

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & .\llm.exe --chat | Out-Null
          exit 0

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            llm
            llm.exe
            *.log
          retention-days: 3
          if-no-files-found: ignore

  results-summary:
    needs: [detect-changes, cpp-build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      RES_CPP_BUILD: ${{ needs.cpp-build.result }}
    steps:
      - name: Summarize Results
        uses: actions/github-script@v9
        with:
          script: |
            const icon = (r) => {
              if (r === 'success') return '✅';
              if (r === 'failure') return '❌';
              return '⏭️';
            };

            let body = '## CI Results\n\n';
            body += '| Job | Status |\n';
            body += '|-----|--------|\n';
            body += `| C++ Build | ${icon(process.env.RES_CPP_BUILD)} |\n`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('CI Results'));
            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            }
