name: ci

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cpp:
              - '**/*.cpp'
              - '**/*.h'
              - '**/*.hpp'
              - '**/*.mm'
              - '**/CMakeLists.txt'
            python:
              - '**/*.py'
              - '**/requirements.txt'
              - '**/pyproject.toml'

  cpp-build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cpp == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu with GCC
          - os: ubuntu-latest
            os_name: Ubuntu
            variant: cpu
            cxx: g++
          # Ubuntu with Clang
          - os: ubuntu-latest
            os_name: Ubuntu
            variant: cpu
            cxx: clang++
          # macOS Apple Silicon
          - os: macos-latest
            os_name: macOS
            variant: cpu
            cxx: clang++
          # Windows MSVC
          - os: windows-latest
            os_name: Windows
            variant: cpu-x64
            # No CXX needed; script explicitly calls vcvarsall.bat
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential g++ clang libomp-dev

      - name: Run Build Script
        env:
          CXX: ${{ matrix.cxx }}
        run: bash .ci/build.sh ${{ matrix.os_name }} ${{ matrix.variant }}

  python-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5 
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          
      - name: Install dependencies & Test
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          pytest -v
