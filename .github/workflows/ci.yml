name: ci
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      python: ${{ steps.filter.outputs.python }}
      cpp_files: ${{ steps.filter.outputs.cpp_files }}
      py_files: ${{ steps.filter.outputs.py_files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          filters: |
            cpp:
              - '**/*.cpp'
              - '**/*.h'
              - '**/*.hpp'
              - '**/*.mm'
              - '**/CMakeLists.txt'
            python:
              - '**/*.py'
              - '**/requirements.txt'
              - '**/pyproject.toml'

  python-lint:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install & Run Ruff (ultra-fast linter)
        run: |
          pip install ruff
          ruff check . --output-format=github
      - name: Check Import Sorting
        run: ruff check . --select I
  python-tests:
    needs: [detect-changes, python-lint]
    if: ${{ needs.detect-changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Verify lockfile consistency
        run: |
          if [ -f "requirements.lock" ]; then
            echo "Checking lockfile consistency..."
            pip install -r requirements.lock --dry-run 2>&1 | grep -i "requirement already satisfied" || true
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "pyproject.toml" ]; then pip install -e .; fi

      - name: Run tests with JUnit output
        run: |
          pytest -v -n auto --tb=short \
            --junitxml=pytest-results-${{ matrix.python-version }}.xml \
            --cov=src --cov-report=xml \
            || true
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: pytest-results-${{ matrix.python-version }}.xml
          retention-days: 7

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: pytest-results-${{ matrix.python-version }}.xml
          check_name: Python ${{ matrix.python-version }} Test Results
  cpp-build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cpp == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Ubuntu
            variant: cpu
            cxx: g++
            cc: gcc
          - os: ubuntu-latest
            os_name: Ubuntu
            variant: cpu
            cxx: clang++
            cc: clang
          - os: macos-latest
            os_name: macOS
            variant: cpu
            cxx: clang++
            cc: clang
          - os: windows-latest
            os_name: Windows
            variant: cpu-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Report compiler version
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then
            echo "CXX=${{ matrix.cxx }}"
            ${{ matrix.cxx }} --version || true
          fi
          if [ -n "${{ matrix.cc }}" ]; then
            echo "CC=${{ matrix.cc }}"
            ${{ matrix.cc }} --version || true
          fi
          cmake --version || true

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ clang libomp-dev ccache ninja-build

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ccache ninja || true
          # Ensure Xcode command line tools for .mm files
          xcode-select -p || xcode-select --install || true

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.cxx }}-${{ matrix.variant }}
          max-size: 500M

      - name: Verify build script exists
        run: |
          if [ ! -f ".ci/build.sh" ]; then
            echo "::error::.ci/build.sh not found!"
            exit 1
          fi
          if [ ! -x ".ci/build.sh" ]; then
            chmod +x .ci/build.sh
          fi

      - name: Run Build Script
        env:
          CXX: ${{ matrix.cxx }}
          CC: ${{ matrix.cc }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CMAKE_GENERATOR: Ninja
        run: |
          echo "Building for ${{ matrix.os_name }} / ${{ matrix.variant }}"
          bash .ci/build.sh "${{ matrix.os_name }}" "${{ matrix.variant }}"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.cxx || 'msvc' }}-${{ matrix.variant }}
          path: |
            build/
            *.log
          retention-days: 3
          if-no-files-found: ignore
  results-summary:
    needs: [detect-changes, python-lint, python-tests, cpp-build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Summarize Results
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = [
              { name: 'Python Lint', job: 'python-lint' },
              { name: 'Python Tests (3.9)', job: 'python-tests', matrix: '3.9' },
              { name: 'Python Tests (3.10)', job: 'python-tests', matrix: '3.10' },
              { name: 'Python Tests (3.11)', job: 'python-tests', matrix: '3.11' },
              { name: 'Python Tests (3.12)', job: 'python-tests', matrix: '3.12' },
              { name: 'C++ Build (Ubuntu GCC)', job: 'cpp-build', matrix: 'ubuntu-latest-g++' },
              { name: 'C++ Build (Ubuntu Clang)', job: 'cpp-build', matrix: 'ubuntu-latest-clang++' },
              { name: 'C++ Build (macOS)', job: 'cpp-build', matrix: 'macos-latest' },
              { name: 'C++ Build (Windows)', job: 'cpp-build', matrix: 'windows-latest' },
            ];

            let body = '## CI Results\\n\\n';
            body += '| Job | Status |\\n';
            body += '|-----|--------|\\n';

            for (const j of jobs) {
              const runs = context.payload.workflow_run?.jobs || [];
              // Simplified: just show what ran
              body += `| ${j.name} | ${needs[j.job]?.result || 'skipped'} |\\n`;
            }

            // Post or update PR comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('CI Results'));
            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            }
