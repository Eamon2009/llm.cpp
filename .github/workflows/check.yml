name: Syntax Check (Modified Files Only)

on:
  push:
    branches: [ "master" ]
    paths:
      - "**/*.py"
      - "**/*.cpp"
      - "**/*.c"
      - "**/*.h"
      - "**/*.hpp"
  pull_request:
    branches: [ "master" ]
    paths:
      - "**/*.py"
      - "**/*.cpp"
      - "**/*.c"
      - "**/*.h"
      - "**/*.hpp"

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Get Changed Files
      id: get_changes
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
        else
          FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})
        fi
        # Use GitHub output instead of env for multi-line safety
        {
          echo "files<<EOF"
          echo "$FILES"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install Python Linter
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    # FIXED: Use process substitution instead of pipe to avoid subshell
    - name: Lint Modified Python Files
      run: |
        errors=0
        while IFS= read -r file; do
          if [[ "$file" == *.py ]] && [ -f "$file" ]; then
            echo "Checking Python file: $file"
            # Expanded rules: syntax errors + undefined names + import issues
            if ! flake8 "$file" --count --select=E9,F63,F7,F82,F401,F402,F403,F405,F821,F822,F823 --show-source --statistics; then
              errors=$((errors + 1))
              echo "::error file=$file::Python lint failed for $file"
            fi
          fi
        done < <(echo "${{ steps.get_changes.outputs.files }}")

        if [ $errors -ne 0 ]; then
          echo "::error::$errors Python file(s) failed linting."
          exit 1
        fi
        echo "All Python files passed."

    # FIXED: Auto-discover include paths + check headers + proper error propagation
    - name: Check C/C++
      run: |
        echo "Discovering include paths..."
        # Auto-find directories containing .h/.hpp files
        INCLUDE_DIRS=$(find . -type f \( -name "*.h" -o -name "*.hpp" \) -exec dirname {} \; | sort -u | sed 's|^\.|\.|' | sed 's|^| -I|' | tr '\n' ' ')
        echo "Found include paths: $INCLUDE_DIRS"

        errors=0
        while IFS= read -r file; do
          [ -f "$file" ] || continue

          case "$file" in
            *.c)
              echo "Checking C file: $file"
              if ! gcc -fsyntax-only -Wall -Wextra $INCLUDE_DIRS -std=c11 "$file" 2>&1; then
                echo "::error file=$file::Syntax error in C file $file"
                errors=$((errors + 1))
              fi
              ;;
            *.cpp|*.hpp)
              echo "Checking C++ file: $file"
              if ! g++ -fsyntax-only -Wall -Wextra $INCLUDE_DIRS -std=c++17 "$file" 2>&1; then
                echo "::error file=$file::Syntax error in C++ file $file"
                errors=$((errors + 1))
              fi
              ;;
            *.h)
              # Try as C first, fallback to C++ if it fails
              echo "Checking header: $file"
              if gcc -fsyntax-only -Wall -Wextra $INCLUDE_DIRS -std=c11 -x c "$file" 2>/dev/null; then
                echo "  Valid C header"
              elif g++ -fsyntax-only -Wall -Wextra $INCLUDE_DIRS -std=c++17 -x c++ "$file" 2>/dev/null; then
                echo "  Valid C++ header"
              else
                echo "::error file=$file::Syntax error in header $file"
                errors=$((errors + 1))
              fi
              ;;
          esac
        done < <(echo "${{ steps.get_changes.outputs.files }}")

        if [ $errors -ne 0 ]; then
          echo "::error::$errors C/C++ file(s) failed syntax verification."
          exit 1
        fi
        echo "All C/C++ files passed."
