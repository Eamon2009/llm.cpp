          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          clang++ --target=x86_64-linux-android21 -std=c++17 -O3 -DNDEBUG -I. -Iinclude -o llm main.cpp
          file llm
      - name: Verify architecture
        shell: bash
        run: |
          set -euo pipefail
          file llm | grep -q "x86-64"
      - name: Pack artifacts
        shell: bash
        run: |
          set -euo pipefail
          package="llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-android-x86_64-cpu"
          mkdir -p "${ARTIFACT_ROOT}/${package}"
          cp llm README.md LICENSE "${ARTIFACT_ROOT}/${package}/"
          tar -czf "${package}.tar.gz" -C "${ARTIFACT_ROOT}" "${package}"
      - uses: actions/upload-artifact@v4
        with:
          name: llm.cpp-bin-android-x86_64-cpu
          path: llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-android-x86_64-cpu.tar.gz
          if-no-files-found: error
          retention-days: 30

