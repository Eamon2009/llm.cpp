  ubuntu-x64-sycl-fp32:
    name: Ubuntu x64 (SYCL FP32)
    needs: release-metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential file
      - name: Install SYCL
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/intel/llvm/releases/download/nightly-2024-07-01/sycl_linux.tar.gz
          sudo mkdir -p /opt/intel/sycl
          sudo tar -xzf sycl_linux.tar.gz -C /opt/intel/sycl
          echo "/opt/intel/sycl/bin" >> "$GITHUB_PATH"
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/intel/sycl/bin:$PATH"
          clang++ -std=c++17 -O3 -DNDEBUG -DENABLE_SYCL -fsycl -fsycl-targets=spir64 -I. -Iinclude -o llm main.cpp
          file llm
      - name: Smoke test
        shell: bash
        run: |
          set +e
          ./llm --chat >/dev/null 2>&1
