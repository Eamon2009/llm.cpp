  publish-release:
    name: Publish GitHub release
    needs:
      - release-metadata
      - macos-arm64-cpu
      - macos-arm64-metal
      - ios-xcframework
      - ubuntu-x64-cpu
      - ubuntu-arm64-cpu
      - ubuntu-x64-vulkan
      - ubuntu-arm64-vulkan
      - ubuntu-x64-cuda12
      - ubuntu-x64-cuda13
      - ubuntu-x64-sycl-fp32
      - ubuntu-x64-sycl-fp16
      - ubuntu-x64-opencl
      - android-arm64-cpu
      - android-arm64-vulkan
      - android-x86_64-cpu
      - windows-x64-cpu
      - windows-arm64-cpu
      - windows-x64-cuda12
      - windows-x64-cuda13
      - windows-x64-vulkan
      - windows-x64-opencl
      - wasm-cpu
      - wasm-simd
    if: always() && needs.release-metadata.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-metadata.outputs.tag_name }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        env:
          RES_MACOS_ARM_CPU: ${{ needs.macos-arm64-cpu.result }}
          RES_MACOS_ARM_METAL: ${{ needs.macos-arm64-metal.result }}
          RES_IOS: ${{ needs.ios-xcframework.result }}
          RES_UBUNTU_X64_CPU: ${{ needs.ubuntu-x64-cpu.result }}
          RES_UBUNTU_ARM_CPU: ${{ needs.ubuntu-arm64-cpu.result }}
          RES_UBUNTU_X64_VULKAN: ${{ needs.ubuntu-x64-vulkan.result }}
          RES_UBUNTU_ARM_VULKAN: ${{ needs.ubuntu-arm64-vulkan.result }}
          RES_UBUNTU_CUDA12: ${{ needs.ubuntu-x64-cuda12.result }}
          RES_UBUNTU_CUDA13: ${{ needs.ubuntu-x64-cuda13.result }}
          RES_UBUNTU_SYCL32: ${{ needs.ubuntu-x64-sycl-fp32.result }}
          RES_UBUNTU_SYCL16: ${{ needs.ubuntu-x64-sycl-fp16.result }}
          RES_UBUNTU_OPENCL: ${{ needs.ubuntu-x64-opencl.result }}
          RES_ANDROID_ARM_CPU: ${{ needs.android-arm64-cpu.result }}
          RES_ANDROID_ARM_VULKAN: ${{ needs.android-arm64-vulkan.result }}
          RES_ANDROID_X86_64: ${{ needs.android-x86_64-cpu.result }}
          RES_WIN_X64_CPU: ${{ needs.windows-x64-cpu.result }}
          RES_WIN_ARM_CPU: ${{ needs.windows-arm64-cpu.result }}
          RES_WIN_CUDA12: ${{ needs.windows-x64-cuda12.result }}
          RES_WIN_CUDA13: ${{ needs.windows-x64-cuda13.result }}
          RES_WIN_VULKAN: ${{ needs.windows-x64-vulkan.result }}
          RES_WIN_OPENCL: ${{ needs.windows-x64-opencl.result }}
          RES_WASM_CPU: ${{ needs.wasm-cpu.result }}
          RES_WASM_SIMD: ${{ needs.wasm-simd.result }}
        run: |
          set -euo pipefail
          TAG="${{ env.TAG }}"

          has_artifact() {
            ls dist/ 2>/dev/null | grep -q "$1"
          }

          get_filename() {
            ls dist/ 2>/dev/null | grep "$1" | head -1 || echo ""
          }

          print_item() {
            local result="$1"
            local label="$2"
            local artifact_key="$3"
            if [ "$result" == "success" ] && has_artifact "$artifact_key"; then
              F=$(get_filename "$artifact_key")
              echo "- ${label} - [${F}](https://github.com/${{ github.repository }}/releases/download/${TAG}/${F})"
            else
              echo "- ${label} - DISABLED"
            fi
          }

          {
            echo "**Website:**"
            echo ""
            echo "- https://lmgnu.github.io/llm.app"
            echo ""
            echo "**macOS / iOS:**"
            echo ""
            print_item "$RES_MACOS_ARM_CPU" "macOS Apple Silicon (arm64)" "macos-arm64-cpu"
            print_item "$RES_MACOS_ARM_METAL" "macOS Apple Silicon (arm64, Metal enabled)" "macos-arm64-metal"
            print_item "$RES_IOS" "iOS XCFramework" "ios-xcframework"
            echo ""
            echo "**Linux:**"
            echo ""
            print_item "$RES_UBUNTU_X64_CPU" "Ubuntu x64 (CPU)" "ubuntu-x64-cpu"
            print_item "$RES_UBUNTU_ARM_CPU" "Ubuntu arm64 (CPU)" "ubuntu-arm64-cpu"
            print_item "$RES_UBUNTU_X64_VULKAN" "Ubuntu x64 (Vulkan)" "ubuntu-x64-vulkan"
            print_item "$RES_UBUNTU_ARM_VULKAN" "Ubuntu arm64 (Vulkan)" "ubuntu-arm64-vulkan"
            print_item "$RES_UBUNTU_CUDA12" "Ubuntu x64 (CUDA 12) - CUDA 12.4 DLLs" "ubuntu-x64-cuda12"
            print_item "$RES_UBUNTU_CUDA13" "Ubuntu x64 (CUDA 13) - CUDA 13.3 DLLs" "ubuntu-x64-cuda13"
            print_item "$RES_UBUNTU_SYCL32" "Ubuntu x64 (SYCL FP32)" "ubuntu-x64-sycl-fp32"
            print_item "$RES_UBUNTU_SYCL16" "Ubuntu x64 (SYCL FP16)" "ubuntu-x64-sycl-fp16"
            print_item "$RES_UBUNTU_OPENCL" "Ubuntu x64 (OpenCL)" "ubuntu-x64-opencl"
            echo ""
            echo "**Android:**"
            echo ""
            print_item "$RES_ANDROID_ARM_CPU" "Android arm64 (CPU)" "android-arm64-cpu"
            print_item "$RES_ANDROID_ARM_VULKAN" "Android arm64 (Vulkan)" "android-arm64-vulkan"
            print_item "$RES_ANDROID_X86_64" "Android x86_64 (CPU)" "android-x86_64-cpu"
            echo ""
            echo "**Windows:**"
            echo ""
            print_item "$RES_WIN_X64_CPU" "Windows x64 (CPU)" "windows-x64-cpu"
            print_item "$RES_WIN_ARM_CPU" "Windows arm64 (CPU)" "windows-arm64-cpu"
            print_item "$RES_WIN_CUDA12" "Windows x64 (CUDA 12) - CUDA 12.4 DLLs" "windows-x64-cuda12"
            print_item "$RES_WIN_CUDA13" "Windows x64 (CUDA 13) - CUDA 13.3 DLLs" "windows-x64-cuda13"
            print_item "$RES_WIN_VULKAN" "Windows x64 (Vulkan)" "windows-x64-vulkan"
            print_item "$RES_WIN_OPENCL" "Windows x64 (OpenCL)" "windows-x64-opencl"
            echo ""
            echo "**WebAssembly:**"
            echo ""
            print_item "$RES_WASM_CPU" "WASM (CPU)" "wasm-cpu"
            print_item "$RES_WASM_SIMD" "WASM (SIMD)" "wasm-simd"
            echo ""
            echo "---"
            echo ""
            echo "Built from commit \`${{ github.sha }}\`."
            echo ""
            echo "For detailed build information and installation instructions, please refer to the [README](../../)."
          } > release-notes.md

          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: false
