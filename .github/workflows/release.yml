  windows-x64-cuda12:
    name: Windows x64 (CUDA 12)
    needs: release-metadata
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if exist "llm.cu" (
            nvcc -O3 -std=c++17 -DENABLE_CUDA -I. -Iinclude -o llm.exe llm.cu
          ) else (
            if defined CUDA_PATH (
              set CUDA_INC=/I"%CUDA_PATH%\include"
              set CUDA_LIB="%CUDA_PATH%\lib\x64\cudart.lib"
            ) else (
              set CUDA_INC=/I"C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\include"
              set CUDA_LIB="C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\lib\x64\cudart.lib"
            )
            cl /nologo /std:c++17 /O2 /DNDEBUG /DENABLE_CUDA /EHsc /Iinclude /I. %CUDA_INC% main.cpp /Fe:llm.exe /link %CUDA_LIB%
          )
      - name: Pack artifacts
        shell: pwsh
        run: |
          $package = "llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-windows-x64-cuda12"
          New-Item -ItemType Directory -Force "${env:ARTIFACT_ROOT}\${package}" | Out-Null
          Copy-Item llm.exe "${env:ARTIFACT_ROOT}\${package}\"
          Copy-Item README.md, LICENSE "${env:ARTIFACT_ROOT}\${package}\"
          $cudaBin = if ($env:CUDA_PATH) { "$env:CUDA_PATH\bin" } else { "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin" }
          if (Test-Path $cudaBin) {
            Copy-Item "$cudaBin\cudart64_*.dll" "${env:ARTIFACT_ROOT}\${package}\" -ErrorAction SilentlyContinue
            Copy-Item "$cudaBin\cublas64_*.dll" "${env:ARTIFACT_ROOT}\${package}\" -ErrorAction SilentlyContinue
          }
          Compress-Archive -Path "${env:ARTIFACT_ROOT}\${package}\*" -DestinationPath "${package}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: llm.cpp-bin-windows-x64-cuda12
          path: llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-windows-x64-cuda12.zip
          if-no-files-found: error
