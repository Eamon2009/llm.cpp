name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.2.3 or 1.2.3"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  ARTIFACT_ROOT: release-assets

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          raw_tag="${{ inputs.version }}"
          if [[ "${raw_tag}" == v* ]]; then
            tag_name="${raw_tag}"
          else
            tag_name="v${raw_tag}"
          fi
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

  macos-arm64-cpu:
    name: macOS Apple Silicon (arm64) CPU
    needs: release-metadata
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O3 -DNDEBUG -arch arm64 -I. -Iinclude -o llm main.cpp
          file llm
      - name: Smoke test
        shell: bash
        run: |
          set +e
          ./llm --chat >/dev/null 2>&1
          exit 0
      - name: Pack artifacts
        shell: bash
        run: |
          set -euo pipefail
          package="llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-macos-arm64-cpu"
          mkdir -p "${ARTIFACT_ROOT}/${package}"
          cp llm README.md LICENSE "${ARTIFACT_ROOT}/${package}/"
          tar -czf "${package}.tar.gz" -C "${ARTIFACT_ROOT}" "${package}"
      - uses: actions/upload-artifact@v4
        with:
          name: llm.cpp-bin-macos-arm64-cpu
          path: llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-macos-arm64-cpu.tar.gz
          if-no-files-found: error
          retention-days: 30

  macos-arm64-metal:
    name: macOS Apple Silicon (arm64) Metal
    needs: release-metadata
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "llm.mm" ]; then
            clang++ -std=c++17 -O3 -DNDEBUG -arch arm64 -DENABLE_METAL -I. -Iinclude llm.mm -framework Foundation -framework Metal -framework MetalPerformanceShaders -o llm
          else
            clang++ -std=c++17 -O3 -DNDEBUG -arch arm64 -DENABLE_METAL -I. -Iinclude -o llm main.cpp
          fi
          file llm
      - name: Pack artifacts
        shell: bash
        run: |
          set -euo pipefail
          package="llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-macos-arm64-metal"
          mkdir -p "${ARTIFACT_ROOT}/${package}"
          cp llm README.md LICENSE "${ARTIFACT_ROOT}/${package}/"
          tar -czf "${package}.tar.gz" -C "${ARTIFACT_ROOT}" "${package}"
      - uses: actions/upload-artifact@v4
        with:
          name: llm.cpp-bin-macos-arm64-metal
          path: llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-macos-arm64-metal.tar.gz
          if-no-files-found: warn
          retention-days: 30

  ios-xcframework:
    name: iOS XCFramework
    needs: release-metadata
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build for iOS (arm64)
        shell: bash
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -std=c++17 -O3 -DNDEBUG -arch arm64 -isysroot "$SDK" -I. -Iinclude -c main.cpp -o llm-ios-arm64.o
          ar rcs libllm-ios-arm64.a llm-ios-arm64.o
      - name: Build for iOS Simulator (x86_64)
        shell: bash
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          clang++ -std=c++17 -O3 -DNDEBUG -arch x86_64 -isysroot "$SDK" -I. -Iinclude -c main.cpp -o llm-ios-sim-x86_64.o
          ar rcs libllm-ios-sim-x86_64.a llm-ios-sim-x86_64.o
      - name: Create XCFramework
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -create-xcframework -library libllm-ios-arm64.a -library libllm-ios-sim-x86_64.a -output LLM.xcframework
      - name: Pack artifacts
        shell: bash
        run: |
          set -euo pipefail
          package="llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-ios-xcframework"
          mkdir -p "${ARTIFACT_ROOT}/${package}"
          cp -r LLM.xcframework README.md LICENSE "${ARTIFACT_ROOT}/${package}/"
          tar -czf "${package}.tar.gz" -C "${ARTIFACT_ROOT}" "${package}"
      - uses: actions/upload-artifact@v4
        with:
          name: llm.cpp-ios-xcframework
          path: llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-ios-xcframework.tar.gz
          if-no-files-found: error
          retention-days: 30

  ubuntu-x64-cpu:
