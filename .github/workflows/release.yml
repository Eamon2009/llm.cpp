  ubuntu-x64-cuda12:
    name: Ubuntu x64 (CUDA 12)
    needs: release-metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install CUDA 12
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.4.0"
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          export LIBRARY_PATH="$CUDA_PATH/lib64${LIBRARY_PATH:+:$LIBRARY_PATH}"
          if [ -f "llm.cu" ]; then
            nvcc -O3 -std=c++17 -DENABLE_CUDA -I. -Iinclude -lcublas -o llm llm.cu
          else
            g++ -std=c++17 -O3 -DNDEBUG -DENABLE_CUDA -I. -Iinclude -L"$CUDA_PATH/lib64" -o llm main.cpp -lcudart -lcublas
          fi
          file llm
      - name: Smoke test
        shell: bash
        run: |
          set +e
          ./llm --chat >/dev/null 2>&1
          exit 0
      - name: Pack artifacts
        shell: bash
        run: |
          set -euo pipefail
          package="llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-ubuntu-x64-cuda12"
          mkdir -p "${ARTIFACT_ROOT}/${package}"
          cp llm README.md LICENSE "${ARTIFACT_ROOT}/${package}/"
          if [ -d "$CUDA_PATH/lib64" ]; then
            cp "$CUDA_PATH/lib64"/libcudart.so* "${ARTIFACT_ROOT}/${package}/" 2>/dev/null || true
            cp "$CUDA_PATH/lib64"/libcublas.so* "${ARTIFACT_ROOT}/${package}/" 2>/dev/null || true
          fi
          tar -czf "${package}.tar.gz" -C "${ARTIFACT_ROOT}" "${package}"
      - uses: actions/upload-artifact@v4
        with:
          name: llm.cpp-bin-ubuntu-x64-cuda12
          path: llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-ubuntu-x64-cuda12.tar.gz
