          sudo apt-get install -y build-essential file
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -DNDEBUG -I. -Iinclude -o llm main.cpp
          file llm
      - name: Smoke test
