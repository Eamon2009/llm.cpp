      - name: Toolchain workaround
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          ${CXX:-g++} -std=c++17 -O3 -DNDEBUG -I. -Iinclude -o llm main.cpp
          file llm
      - name: Smoke test
        shell: bash
        run: |
          set +e
          ./llm --chat >/dev/null 2>&1
          exit 0
      - name: Pack artifacts
