      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -DNDEBUG -DENABLE_VULKAN -I. -Iinclude -o llm main.cpp -lvulkan
          file llm
      - name: Smoke test
        shell: bash
        run: |
