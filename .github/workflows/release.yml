name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.2.3 or 1.2.3"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  ARTIFACT_ROOT: release-assets

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          raw_tag="${{ inputs.version }}"
          if [[ "${raw_tag}" == v* ]]; then
            tag_name="${raw_tag}"
          else
            tag_name="v${raw_tag}"
          fi
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

  macos-arm64-cpu:
    name: macOS Apple Silicon (arm64) CPU
    needs: release-metadata
    runs-on: macos-14
    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenMP
        run: brew install libomp

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -march=native -fopenmp -DNDEBUG -arch arm64 \
            -I. -Iinclude \
            -o llm main.cpp -Xpreprocessor -fopenmp -lomp
          file llm

      - name: Pack artifacts
        shell: bash
        run: |
          set -euo pipefail
          package="llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-macos-arm64-cpu"
          mkdir -p "${ARTIFACT_ROOT}/${package}"
          cp llm README.md LICENSE "${ARTIFACT_ROOT}/${package}/"
          tar -czf "${package}.tar.gz" -C "${ARTIFACT_ROOT}" "${package}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llm.cpp-bin-macos-arm64-cpu
          path: llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-macos-arm64-cpu.tar.gz
          if-no-files-found: error
          retention-days: 30

  ubuntu-x64-cpu:
    name: Ubuntu x64 (CPU)
    needs: release-metadata
    runs-on: ubuntu-22.04
    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -march=native -fopenmp -I. -Iinclude -o llm main.cpp
          file llm

      - name: Pack artifacts
        shell: bash
        run: |
          set -euo pipefail
          package="llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-ubuntu-x64-cpu"
          mkdir -p "${ARTIFACT_ROOT}/${package}"
          cp llm README.md LICENSE "${ARTIFACT_ROOT}/${package}/"
          tar -czf "${package}.tar.gz" -C "${ARTIFACT_ROOT}" "${package}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llm.cpp-bin-ubuntu-x64-cpu
          path: llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-ubuntu-x64-cpu.tar.gz
          if-no-files-found: error
          retention-days: 30

  ubuntu-arm64-cpu:
    name: Ubuntu arm64 (CPU)
    needs: release-metadata
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          ${CXX:-g++} -std=c++17 -O3 -march=native -fopenmp -I. -Iinclude -o llm main.cpp
          file llm

      - name: Pack artifacts
        shell: bash
        run: |
          set -euo pipefail
          package="llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-ubuntu-arm64-cpu"
          mkdir -p "${ARTIFACT_ROOT}/${package}"
          cp llm README.md LICENSE "${ARTIFACT_ROOT}/${package}/"
          tar -czf "${package}.tar.gz" -C "${ARTIFACT_ROOT}" "${package}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llm.cpp-bin-ubuntu-arm64-cpu
          path: llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-ubuntu-arm64-cpu.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows-x64-cpu:
    name: Windows x64 (CPU)
    needs: release-metadata
    runs-on: windows-2022
    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2 and MinGW GCC
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openmp

      - name: Build
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O3 -march=native -fopenmp -I. -Iinclude -o llm.exe main.cpp

      - name: Pack artifacts
        shell: pwsh
        run: |
          $package = "llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-windows-x64-cpu"
          New-Item -ItemType Directory -Force "${env:ARTIFACT_ROOT}\${package}" | Out-Null
          Copy-Item llm.exe "${env:ARTIFACT_ROOT}\${package}\"
          Copy-Item README.md, LICENSE "${env:ARTIFACT_ROOT}\${package}\"
          Compress-Archive -Path "${env:ARTIFACT_ROOT}\${package}\*" -DestinationPath "${package}.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llm.cpp-bin-windows-x64-cpu
          path: llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-windows-x64-cpu.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub release
    needs:
      - release-metadata
      - macos-arm64-cpu
      - ubuntu-x64-cpu
      - ubuntu-arm64-cpu
      - windows-x64-cpu
    if: always() && needs.release-metadata.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-metadata.outputs.tag_name }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        env:
          RES_MACOS_ARM: ${{ needs.macos-arm64-cpu.result }}
          RES_UBUNTU_X64_CPU: ${{ needs.ubuntu-x64-cpu.result }}
          RES_UBUNTU_ARM_CPU: ${{ needs.ubuntu-arm64-cpu.result }}
          RES_WIN_X64_CPU: ${{ needs.windows-x64-cpu.result }}
        run: |
          print_row() {
            local os="$1"
            local arch="$2"
            local variant="$3"
            local result="$4"
            local filename="$5"
            
            if [[ "$result" == "success" ]]; then
              echo "| $os | $arch | $variant | Built | [Download](../../releases/download/$TAG/$filename) |"
            elif [[ "$result" == "skipped" ]]; then
              echo "| $os | $arch | $variant | Skipped | - |"
            else
              echo "| $os | $arch | $variant | Failed | - |"
            fi
          }

          {
            echo "# Release $TAG"
            echo ""
            echo "## Platform Support"
            echo ""
            
            echo "### macOS"
            echo "| Platform | Architecture | Variant | Status | Download |"
            echo "|----------|--------------|---------|--------|----------|"
            print_row "macOS" "Apple Silicon (arm64)" "CPU" "$RES_MACOS_ARM" "llm.cpp-$TAG-bin-macos-arm64-cpu.tar.gz"
            echo ""
            
            echo "### Linux (Ubuntu)"
            echo "| Platform | Architecture | Variant | Status | Download |"
            echo "|----------|--------------|---------|--------|----------|"
            print_row "Ubuntu" "x64" "CPU" "$RES_UBUNTU_X64_CPU" "llm.cpp-$TAG-bin-ubuntu-x64-cpu.tar.gz"
            print_row "Ubuntu" "arm64" "CPU" "$RES_UBUNTU_ARM_CPU" "llm.cpp-$TAG-bin-ubuntu-arm64-cpu.tar.gz"
            echo ""
            
            echo "### Windows"
            echo "| Platform | Architecture | Variant | Status | Download |"
            echo "|----------|--------------|---------|--------|----------|"
            print_row "Windows" "x64" "CPU" "$RES_WIN_X64_CPU" "llm.cpp-$TAG-bin-windows-x64-cpu.zip"
            echo ""
            
            echo "## Legend"
            echo "- **Built**: Successfully compiled and available for download."
            echo "- **Failed**: Build failed during compilation or testing."
            echo "- **Skipped**: Build was bypassed or cancelled."
            echo ""
            echo "---"
            echo "For detailed build information and installation instructions, please refer to the README."
          } > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-metadata.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          body_path: release-notes.md
          files: dist/*
