  android-arm64-cpu:
    name: Android arm64 (CPU)
    needs: release-metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          clang++ --target=aarch64-linux-android21 -std=c++17 -O3 -DNDEBUG -I. -Iinclude -o llm main.cpp
          file llm
      - name: Verify architecture
        shell: bash
        run: |
          set -euo pipefail
          file llm | grep -q "ARM aarch64"
      - name: Pack artifacts
        shell: bash
        run: |
          set -euo pipefail
          package="llm.cpp-${{ needs.release-metadata.outputs.tag_name }}-bin-android-arm64-cpu"
