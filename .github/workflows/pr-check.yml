name: PR Comment Checks

on:
  issue_comment:
    types: [created, edited]

permissions:
  pull-requests: write
  contents: read
  checks: write

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/run-checks')
    
    outputs:
      pr_number: ${{ github.event.issue.number }}
    
    steps:
      - name: Add reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            })

      - name: Update comment with status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              body: '🚀 **Running strict checks...** (initiated by @${{ github.event.comment.user.login }})\n\n⏳ Please wait for results...'
            })

  strict-cpp-checks:
    runs-on: ubuntu-latest
    needs: check-trigger
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.issue.number }}/merge

      - name: Install C++ tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-format clang-tidy cppcheck \
            build-essential cmake g++ clang

      - name: Run clang-format check (strict)
        id: clang-format
        run: |
          echo "### Clang Format Check" >> $GITHUB_STEP_SUMMARY
          find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | grep -v build > cpp_files.txt
          if [ -s cpp_files.txt ]; then
            clang-format --dry-run -Werror $(cat cpp_files.txt) 2>&1 | tee format_output.txt || true
            if grep -q "error:" format_output.txt; then
              echo "❌ **Format violations found**" >> $GITHUB_STEP_SUMMARY
              cat format_output.txt >> $GITHUB_STEP_SUMMARY
              exit 1
            else
              echo "✅ Code formatting is correct" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No C++ files found" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Run cppcheck (strict static analysis)
        id: cppcheck
        run: |
          echo "### CppCheck Analysis" >> $GITHUB_STEP_SUMMARY
          cppcheck \
            --enable=all \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --std=c++17 \
            . 2>&1 | tee cppcheck_output.txt || true
          if [ $? -eq 1 ]; then
            echo "❌ **Static analysis issues found**" >> $GITHUB_STEP_SUMMARY
            cat cppcheck_output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No critical issues found" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Run clang-tidy
        id: clang-tidy
        run: |
          echo "### Clang-Tidy Check" >> $GITHUB_STEP_SUMMARY
          
          find . -name "*.cpp" -o -name "*.h" | grep -v build | head -20 | while read file; do
            clang-tidy "$file" \
              -checks="*,-fuchsia-*,-google-*,-llvm-*,-readability-magic-numbers" \
              -fix-errors \
              --format-style=file \
              2>&1 || true
          done | tee clang_tidy_output.txt
          
          if grep -q "error:" clang_tidy_output.txt; then
            echo "❌ **Clang-tidy warnings found**" >> $GITHUB_STEP_SUMMARY
            grep "error:" clang_tidy_output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Clang-tidy passed" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  strict-python-checks:
    runs-on: ubuntu-latest
    needs: check-trigger
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.issue.number }}/merge

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python tools
        run: |
          pip install --upgrade pip
          pip install \
            black isort flake8 pylint mypy \
            bandit radon pytest pytest-cov \
            vulture

      - name: Black format check (strict)
        id: black
        run: |
          echo "### Black Format Check" >> $GITHUB_STEP_SUMMARY
          black --check --diff . 2>&1 | tee black_output.txt || true
          if [ $? -ne 0 ]; then
            echo "❌ **Black formatting issues found**" >> $GITHUB_STEP_SUMMARY
            cat black_output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Black formatting passed" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: isort import sorting check
        id: isort
        run: |
          echo "### isort Import Check" >> $GITHUB_STEP_SUMMARY
          isort --check-only --diff . 2>&1 | tee isort_output.txt || true
          if [ $? -ne 0 ]; then
            echo "❌ **Import sorting issues found**" >> $GITHUB_STEP_SUMMARY
            cat isort_output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Import sorting is correct" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Flake8 linting (strict)
        id: flake8
        run: |
          echo "### Flake8 Linting" >> $GITHUB_STEP_SUMMARY
          flake8 . --max-line-length=127 --count --statistics 2>&1 | tee flake8_output.txt || true
          if [ $? -ne 0 ]; then
            echo "❌ **Flake8 violations found**" >> $GITHUB_STEP_SUMMARY
            cat flake8_output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Flake8 passed" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Pylint analysis (strict)
        id: pylint
        run: |
          echo "### Pylint Analysis" >> $GITHUB_STEP_SUMMARY
          find . -name "*.py" -type f | head -20 | xargs pylint \
            --fail-under=8.0 \
            --disable=C0111,C0103,R0913 \
            2>&1 | tee pylint_output.txt || true
          
          if grep -q "rated at" pylint_output.txt; then
            echo "✅ Pylint analysis complete" >> $GITHUB_STEP_SUMMARY
            tail -5 pylint_output.txt >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: MyPy type checking
        id: mypy
        run: |
          echo "### MyPy Type Check" >> $GITHUB_STEP_SUMMARY
          mypy . --ignore-missing-imports --strict 2>&1 | tee mypy_output.txt || true
          if [ $? -ne 0 ]; then
            echo "⚠️ **Type checking issues found**" >> $GITHUB_STEP_SUMMARY
            head -20 mypy_output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ MyPy type checking passed" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Bandit security check
        id: bandit
        run: |
          echo "### Bandit Security Scan" >> $GITHUB_STEP_SUMMARY
          bandit -r . -ll 2>&1 | tee bandit_output.txt || true
          if grep -q "Issue:" bandit_output.txt; then
            echo "⚠️ **Security issues found**" >> $GITHUB_STEP_SUMMARY
            grep -A2 "Issue:" bandit_output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No security issues found" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Code complexity check
        id: complexity
        run: |
          echo "### Code Complexity" >> $GITHUB_STEP_SUMMARY
          radon cc . -s 2>&1 | tee radon_output.txt || true
          echo "✅ Complexity analysis complete" >> $GITHUB_STEP_SUMMARY
          head -20 radon_output.txt >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Dead code detection
        id: vulture
        run: |
          echo "### Dead Code Detection" >> $GITHUB_STEP_SUMMARY
          vulture . 2>&1 | tee vulture_output.txt || true
          if [ -s vulture_output.txt ]; then
            echo "⚠️ **Potentially dead code found**" >> $GITHUB_STEP_SUMMARY
            cat vulture_output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No dead code detected" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  build-test:
    runs-on: ubuntu-latest
    needs: check-trigger
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.issue.number }}/merge

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential g++ clang

      - name: Try CMake build
        id: cmake-build
        run: |
          echo "### C++ Build Test" >> $GITHUB_STEP_SUMMARY
          if [ -f "CMakeLists.txt" ]; then
            echo "Found CMakeLists.txt - Using CMake" >> $GITHUB_STEP_SUMMARY
            mkdir -p build
            cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release 2>&1 | tee cmake_output.txt
            if [ $? -ne 0 ]; then
              echo "❌ **CMake configuration failed**" >> $GITHUB_STEP_SUMMARY
              cat cmake_output.txt >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
            cmake --build . --config Release --parallel 4 2>&1 | tee build_output.txt
            if [ $? -ne 0 ]; then
              echo "❌ **CMake build failed**" >> $GITHUB_STEP_SUMMARY
              cat build_output.txt >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
            echo "✅ CMake build successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No CMakeLists.txt found - skipping CMake build" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Direct C++ compilation (no CMake)
        id: direct-compile
        run: |
          echo "### Direct C++ Compilation" >> $GITHUB_STEP_SUMMARY
          
          # Find all .cpp files and try to compile them
          cpp_files=$(find . -name "*.cpp" -type f | grep -v build)
          
          if [ -z "$cpp_files" ]; then
            echo "⚠️ No .cpp files found" >> $GITHUB_STEP_SUMMARY
          else
            echo "Found C++ source files:" >> $GITHUB_STEP_SUMMARY
            echo "$cpp_files" | head -10 >> $GITHUB_STEP_SUMMARY
            
            # Compile with warnings as errors
            g++ -Wall -Wextra -std=c++17 -c $cpp_files 2>&1 | tee compile_output.txt || true
            
            if [ -s compile_output.txt ] && grep -q "error:" compile_output.txt; then
              echo "❌ **Compilation errors found**" >> $GITHUB_STEP_SUMMARY
              cat compile_output.txt >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ C++ files compiled successfully" >> $GITHUB_STEP_SUMMARY
            fi
            
            # Clean up object files
            find . -name "*.o" -delete
          fi
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Python tests
        id: pytest
        run: |
          echo "### Python Tests" >> $GITHUB_STEP_SUMMARY
          pip install pytest pytest-cov
          
          # Try to install requirements if they exist
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt 2>/dev/null || echo "⚠️ Some requirements failed to install"
          else
            echo "⚠️ No requirements.txt found" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Run tests if test directory or test_*.py files exist
          if [ -d "tests" ] || [ -d "test" ] || [ ! -z "$(find . -name 'test_*.py' -o -name '*_test.py')" ]; then
            pytest --cov=. --cov-report=term -v 2>&1 | tee pytest_output.txt || true
            if [ $? -eq 0 ]; then
              echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Some tests failed (see details below)" >> $GITHUB_STEP_SUMMARY
            fi
            tail -30 pytest_output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No test files found (test_*.py or *_test.py)" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  summary:
    runs-on: ubuntu-latest
    needs: [strict-cpp-checks, strict-python-checks, build-test]
    if: always()
    
    steps:
      - name: Update PR comment with results
        uses: actions/github-script@v7
        with:
          script: |
            const cpp_status = '${{ needs.strict-cpp-checks.result }}' === 'success' ? '✅' : '⚠️';
            const python_status = '${{ needs.strict-python-checks.result }}' === 'success' ? '✅' : '⚠️';
            const build_status = '${{ needs.build-test.result }}' === 'success' ? '✅' : '⚠️';
            
            const comment = `## 🔍 Strict Check Results

${cpp_status} **C++ Checks** - ${cpp_status === '✅' ? 'All checks passed' : 'Some issues found'}
${python_status} **Python Checks** - ${python_status === '✅' ? 'All checks passed' : 'Some issues found'}
${build_status} **Build & Tests** - ${build_status === '✅' ? 'All tests passed' : 'Some tests failed'}

**Overall Status:** ${cpp_status === '✅' && python_status === '✅' && build_status === '✅' ? '✅ PASSED' : '⚠️ REVIEW REQUIRED'}

See the [full check results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
